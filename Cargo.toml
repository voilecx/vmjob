[workspace]
resolver = "3"
members = ["crates/vmjob-api", "crates/vmjob-runner", "crates/vmjob-init", "crates/vmjob-operator", "crates/vmjob-kvm-plugin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/voilecx/vmjob"

[workspace.dependencies]
vmjob-api = { path = "crates/vmjob-api", version = "0.1.0" }
anyhow = "1"
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_37", "schemars"] }
kube = { version = "5.1", default-features = false, features = ["client", "rustls-tls", "ring", "runtime", "derive"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "process", "time", "fs", "net", "io-util", "io-std", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
