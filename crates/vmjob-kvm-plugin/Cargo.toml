[package]
name = "vmjob-kvm-plugin"
description = "A kubelet device plugin that hands /dev/kvm to vmjob runner pods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
prost = "0.14"
tokio.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tower = { version = "0.5.3", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
vmjob-api.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
protox = "0.10"
tonic-prost-build = { version = "0.14", default-features = false, features = ["transport"] }

[lints]
workspace = true
