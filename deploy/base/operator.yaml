# The operator: one replica, watching every namespace. It needs to read and
# write VmJobs and their status, and to make and read the runner pods it owns.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmjob-operator
  namespace: vmjob-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmjob-operator
rules:
  - apiGroups: [vmjob.voile.cx]
    resources: [vmjobs]
    verbs: [get, list, watch, delete]
  - apiGroups: [vmjob.voile.cx]
    resources: [vmjobs/status]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vmjob-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vmjob-operator
subjects:
  - kind: ServiceAccount
    name: vmjob-operator
    namespace: vmjob-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmjob-operator
  namespace: vmjob-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vmjob-operator
  template:
    metadata:
      labels:
        app: vmjob-operator
    spec:
      serviceAccountName: vmjob-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/voilecx/vmjob-operator:main
          env:
            - name: VMJOB_RUNNER_IMAGE
              value: ghcr.io/voilecx/vmjob-runner:main
            - name: RUST_LOG
              value: info
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
